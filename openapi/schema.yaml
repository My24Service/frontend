components:
  schemas:
    Action:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        address:
          type: string
          nullable: true
          maxLength: 255
        subject:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
        template:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/ActionTypeEnum'
        company_partner:
          type: integer
          nullable: true
        json_conditions:
          nullable: true
        querymode:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/QuerymodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        statuscode:
          type: integer
        destination:
          type: string
          nullable: true
          readOnly: true
        conditions:
          type: string
          readOnly: true
        override_status:
          type: boolean
      required:
      - conditions
      - destination
      - id
      - name
      - statuscode
      - type
    ActionTypeEnum:
      enum:
      - email
      - send_sms
      - send_fcm
      - email_assigned
      - copy
      - status
      - email_workorders
      - email_ics
      - send_to_gripp
      type: string
      description: |-
        * `email` - send email
        * `send_sms` - send_sms
        * `send_fcm` - send fcm
        * `email_assigned` - email assigned engineers
        * `copy` - copy to partner
        * `status` - status change original order
        * `email_workorders` - send workorders as email
        * `email_ics` - send email with calendar (ics) file
        * `send_to_gripp` - send to Gripp
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
        created:
          type: string
          readOnly: true
          description: Display string in the tenant's configured date_format, not
            an ISO-8601 datetime.
      required:
      - created
      - id
      - text
    ApiUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
        api_user:
          $ref: '#/components/schemas/ApiUserSub'
      required:
      - api_user
      - id
      - username
    ApiUserSub:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        token:
          type: string
          readOnly: true
        expire_start_dt:
          type: string
          format: date-time
        expire_in_days:
          type: integer
          maximum: 2147483647
          minimum: 0
        token_is_revoked:
          type: boolean
          readOnly: true
      required:
      - expire_in_days
      - name
      - token
      - token_is_revoked
      - uuid
    AppUserSettings:
      type: object
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        settings: {}
      required:
      - pk
      - settings
    AssignedOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        engineer:
          type: integer
          nullable: true
        student_user:
          type: integer
          nullable: true
        order:
          type: integer
        started:
          type: string
          format: date-time
          nullable: true
        ended:
          type: string
          format: date-time
          nullable: true
        rating:
          type: integer
          maximum: 32767
          minimum: 0
        user_full_name:
          type: string
          readOnly: true
        order_name:
          type: string
          readOnly: true
        order_city:
          type: string
          nullable: true
          readOnly: true
        order_date:
          type: string
          readOnly: true
      required:
      - id
      - order
      - order_city
      - order_date
      - order_name
      - user_full_name
    AssignedOrderActivity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assigned_order:
          type: integer
        work_start:
          type: string
          format: time
          nullable: true
        work_end:
          type: string
          format: time
          nullable: true
        unforeseen_work_duration:
          type: string
          nullable: true
        unforeseen_work_description:
          type: string
          nullable: true
        travel_to:
          type: string
          format: time
          nullable: true
        travel_back:
          type: string
          format: time
          nullable: true
        distance_to:
          type: integer
          maximum: 2147483647
          minimum: 0
        distance_back:
          type: integer
          maximum: 2147483647
          minimum: 0
        activity_date:
          type: string
          format: date
        extra_work:
          type: string
          nullable: true
        extra_work_description:
          type: string
          nullable: true
        distance_fixed_rate_amount:
          type: integer
          maximum: 2147483647
          minimum: 0
        actual_work:
          type: string
          format: time
          nullable: true
        order:
          type: string
          readOnly: true
      required:
      - assigned_order
      - id
      - order
    AssignedOrderDocument:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assigned_order:
          type: integer
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        document:
          type: string
          format: uri
        modified:
          type: string
          readOnly: true
          description: Display string in the tenant's configured date_format, not
            an ISO-8601 datetime.
        created:
          type: string
          readOnly: true
          description: Display string in the tenant's configured date_format, not
            an ISO-8601 datetime.
        filename:
          type: string
          readOnly: true
        url:
          type: string
          readOnly: true
      required:
      - assigned_order
      - created
      - filename
      - id
      - modified
      - name
      - url
    AssignedOrderMaterial:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assigned_order:
          type: integer
        material:
          type: integer
          nullable: true
        location:
          type: integer
          nullable: true
        location_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        material_name:
          type: string
          nullable: true
          maxLength: 255
        material_identifier:
          type: string
          nullable: true
          maxLength: 255
        mutation_simple_id:
          type: integer
          nullable: true
          readOnly: true
        is_extra:
          type: boolean
      required:
      - assigned_order
      - id
      - location_name
      - mutation_simple_id
    AssignedOrderWorkOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assigned_order:
          type: integer
        signature_user:
          type: string
          format: uri
        signature_name_user:
          type: string
          nullable: true
          maxLength: 255
        signature_engineer:
          type: string
          format: uri
        signature_name_engineer:
          type: string
          nullable: true
          maxLength: 255
        signature_customer:
          type: string
          format: uri
        signature_name_customer:
          type: string
          nullable: true
          maxLength: 255
        description_work:
          type: string
          nullable: true
        assigned_order_workorder_id:
          type: string
        customer_emails:
          type: string
          nullable: true
        equipment:
          type: string
          nullable: true
      required:
      - assigned_order
      - id
    BlankEnum:
      enum:
      - ''
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 255
        postal:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 255
        country_code:
          type: string
          maxLength: 2
        tel:
          type: string
          nullable: true
          maxLength: 100
        email:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
          maxLength: 100
        image:
          type: string
          format: uri
        image_url:
          type: string
          nullable: true
          readOnly: true
        created:
          type: string
          readOnly: true
          description: Display string in the tenant's configured date_format, not
            an ISO-8601 datetime.
        modified:
          type: string
          readOnly: true
          description: Display string in the tenant's configured date_format, not
            an ISO-8601 datetime.
        num_orders:
          type: integer
          nullable: true
          readOnly: true
      required:
