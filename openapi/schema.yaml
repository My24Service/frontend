      - city
      - created
      - id
      - image_url
      - modified
      - name
      - num_orders
      - postal
    Budget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        year:
          type: integer
          maximum: 2147483647
          minimum: 0
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,2})?$
        amount_currency:
          type: string
          readOnly: true
        created:
          type: string
          readOnly: true
