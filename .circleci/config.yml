version: '2.1'

jobs:
  test:
    working_directory: ~/circleci-frontend
    docker:
      - image: cimg/node:22.16
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "package-lock.json" }}
            - v1-npm-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v1-npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run test suite
          command: npm test
  build-push-main:
    working_directory: ~/circleci-frontend
    docker:
      - image: cimg/base:current-24.04
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Docker login registry.chapter3-it.io
          command: docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN registry.chapter3-it.io
      - run:
          name: Build image
          command: docker build -t registry.chapter3-it.io/my24service/frontend-main:latest .
      - run:
          name: Push image
          command: docker push registry.chapter3-it.io/my24service/frontend-main:latest
  build-push-develop:
    working_directory: ~/circleci-frontend
    docker:
      - image: cimg/base:current-24.04
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Docker login registry.chapter3-it.io
          command: docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN registry.chapter3-it.io
      - run:
          name: Build image
          command: docker build -t registry.chapter3-it.io/my24service/frontend-develop:latest .
      - run:
          name: Push image
          command: docker push registry.chapter3-it.io/my24service/frontend-develop:latest

workflows:
   version: 2
   test-and-build:
     jobs:
       # Deliberately unfiltered. Combined with the project-level
       # "Only build pull requests" setting, this runs the suite on every PR
       # and on the default branch, and nowhere else. CircleCI branch filters
       # cannot see a PR's target branch, so this is the only way to cover
       # PRs into develop/main.
       - test
       - build-push-main:
           requires:
             - test
           filters:
             branches:
               only: main
       - build-push-develop:
           requires:
             - test
           filters:
             branches:
               only: develop
