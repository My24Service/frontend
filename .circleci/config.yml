version: "2.1"

executors:
  node:
    working_directory: ~/circleci-frontend
    docker:
      - image: cimg/node:22.16
    environment:
      PNPM_HOME: /home/circleci/.local/share/pnpm
      # CircleCI runs steps under bash but does not export $SHELL, which
      # pnpm's install script needs for `pnpm setup`. The profile it writes
      # is never reloaded in CI; PATH is handled via $BASH_ENV below.
      SHELL: /bin/bash

commands:
  install-deps:
    steps:
      - restore_cache:
          name: Restore pnpm Package Cache
          keys:
            - pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install pnpm package manager
          command: |
            curl -fsSL https://get.pnpm.io/install.sh | sh -
            echo 'export PATH="$PNPM_HOME/bin:$PATH"' >> "$BASH_ENV"
            "$PNPM_HOME/bin/pnpm" config set store-dir .pnpm-store
      - run:
          name: Install Dependencies
          command: pnpm install
      - save_cache:
          name: Save pnpm Package Cache
          key: pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .pnpm-store

jobs:
  check:
    executor: node
    # scripts/lint.mjs runs node with an 8 GB heap ceiling; medium has 4 GB.
    resource_class: large
    steps:
      - checkout
      - install-deps
      - run:
          # vue-tsc and the type-aware lint read auto-imports.gen.d.ts and
          # components.gen.d.ts, which are gitignored. unplugin-auto-import and
          # unplugin-vue-components write them only while Vite transforms the
          # source, so a build is what produces them (about 30s).
          name: Generate auto-import and component types
          command: pnpm run build
      - run:
          name: Type-check
          command: pnpm run typecheck
      # Lint, steps below. Everywhere but main it reuses the lint results of
      # earlier CI runs and re-lints only files whose content changed. A cached
      # result can miss an error caused by a type changed in an imported file,
      # so main restores nothing and lints everything (about 16 minutes).
      - when:
          condition:
            not:
              equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                # Subject line only, so a message body can mention the token.
                name: Skip lint when the last commit's subject has [skip lint]
                command: |
                  if git log -1 --format=%s | grep -qF '[skip lint]'; then
                    echo "Found [skip lint] in the last commit's subject; skipping lint."
                    circleci-agent step halt
                  fi
            - restore_cache:
                name: Restore ESLint cache
                keys:
                  - eslint-v1-{{ checksum "pnpm-lock.yaml" }}-{{ checksum "eslint.config.js" }}-{{ .Branch }}-
                  - eslint-v1-{{ checksum "pnpm-lock.yaml" }}-{{ checksum "eslint.config.js" }}-
      - run:
          name: Lint
          command: pnpm run lint
      - save_cache:
          name: Save ESLint cache
          # Also after a failed lint: the results of the files that passed
          # are still valid, and files with errors are re-reported from it.
          when: always
          key: eslint-v1-{{ checksum "pnpm-lock.yaml" }}-{{ checksum "eslint.config.js" }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - node_modules/.cache/.eslintcache
  test:
    executor: node
    steps:
      - checkout
      - install-deps
      - run:
          name: Run test suite
          # Defined in .circleci/test-suites.yml. It still shards within the
          # container (scripts/vitest-shards.mjs), otherwise it runs OOM.
          command: circleci testsuite run "unit tests"
      - run:
          # Contract usage gate (block A). Warns only for now: it exits 0 and
          # lists operations no client calls. Switches to a failure in block A
          # step 7 (`pnpm run usage-gate -- --strict`).
          name: Contract usage gate (warning only)
          command: pnpm run usage-gate
  build-push-main:
    working_directory: ~/circleci-frontend
    docker:
      - image: cimg/base:current-24.04
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Docker login registry.chapter3-it.io
          command: docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN registry.chapter3-it.io
      - run:
          name: Build image
          command: docker build -t registry.chapter3-it.io/my24service/frontend-main:latest .
      - run:
          name: Push image
          command: docker push registry.chapter3-it.io/my24service/frontend-main:latest
  build-push-develop:
    working_directory: ~/circleci-frontend
    docker:
      - image: cimg/base:current-24.04
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Docker login registry.chapter3-it.io
          command: docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN registry.chapter3-it.io
      - run:
          name: Build image
          command: docker build -t registry.chapter3-it.io/my24service/frontend-develop:latest .
      - run:
          name: Push image
          command: docker push registry.chapter3-it.io/my24service/frontend-develop:latest

workflows:
  version: 2
  test-and-build:
    jobs:
      - check:
          filters:
            branches:
              only: [develop, main]
      - test:
          filters:
            branches:
              only: [develop, main]
      - build-push-main:
          requires:
            - check
            - test
          filters:
            branches:
              only: main
      - build-push-develop:
          requires:
            - check
            - test
          filters:
            branches:
              only: develop
